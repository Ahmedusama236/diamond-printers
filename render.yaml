services:
  - type: web
    name: diamond-printers
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm --prefix client install && npm --prefix server install && npm run build:web
    startCommand: npm run start:web
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/diamond-printers-data
